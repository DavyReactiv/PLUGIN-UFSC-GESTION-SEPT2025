name: Apply licence flow levels UX

on:
  push:
    branches: [ agent/licence-flow-levels-ux ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/licence-flow-levels-ux
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 .github/scripts/apply-licence-flow-levels-ux.py
      - name: Validate PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Validate JavaScript syntax
        run: find assets -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Run regression suite
        run: |
          chmod +x tests/run-tests.sh
          tests/run-tests.sh
      - name: Remove temporary audit and patch helpers
        run: |
          rm -f .github/workflows/audit-licence-flow.yml
          rm -f .github/workflows/apply-licence-flow-levels-ux.yml
          rm -f .github/scripts/apply-licence-flow-levels-ux.py
      - name: Commit final changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify licence pack flow and boxer levels'
          git push origin HEAD:agent/licence-flow-levels-ux

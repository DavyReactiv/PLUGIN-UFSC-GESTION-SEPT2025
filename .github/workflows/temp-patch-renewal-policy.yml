name: Temporary renewal policy patch

on:
  push:
    branches:
      - hotfix/production-renewal-affiliation-20260820
    paths:
      - .github/workflows/temp-patch-renewal-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-renewal-affiliation-20260820
          fetch-depth: 0
      - name: Apply targeted source patches
        run: |
          python - <<'PY'
          from pathlib import Path

          renewal = Path('includes/core/class-ufsc-renewal-service.php')
          text = renewal.read_text(encoding='utf-8')
          old = """        $source_status = function_exists( 'ufsc_get_licence_status_from_record' ) ? ufsc_get_licence_status_from_record( $source_row ) : sanitize_key( (string) ( ! empty( $source_row->statut ) ? $source_row->statut : ( $source_row->status ?? '' ) ) );
        if ( in_array( $source_status, array( 'validated', 'valid', 'active', 'approved' ), true ) ) { $source_status = 'valide'; }
        if ( 'valide' !== $source_status ) { return new WP_Error( 'source_status_blocked', __( 'Seule une licence validée de la saison précédente peut être renouvelée.', 'ufsc-clubs' ) ); }
"""
          new = """        $source_status = function_exists( 'ufsc_get_licence_status_from_record' ) ? ufsc_get_licence_status_from_record( $source_row ) : sanitize_key( (string) ( ! empty( $source_row->statut ) ? $source_row->statut : ( $source_row->status ?? '' ) ) );
        if ( in_array( $source_status, array( 'validated', 'valid', 'active', 'approved' ), true ) ) { $source_status = 'valide'; }
        $renewable_source_statuses = array( 'valide', 'brouillon', 'draft', 'en_attente', 'pending', 'pending_validation', 'pending_payment', 'non_payee', 'a_completer', 'incomplete' );
        if ( ! in_array( $source_status, $renewable_source_statuses, true ) ) { return new WP_Error( 'source_status_blocked', __( 'Cette licence historique ne peut pas être renouvelée dans son état actuel.', 'ufsc-clubs' ) ); }
"""
          if old not in text:
              raise SystemExit('renewal status block not found')
          renewal.write_text(text.replace(old, new, 1), encoding='utf-8')

          front = Path('includes/frontend/class-frontend-shortcodes.php')
          text = front.read_text(encoding='utf-8')
          old = """        if ( 'licences-archives' === $section ) {
            $url = add_query_arg( 'ufsc_section', 'licences-archives', $url ) . '#ufsc-licences-archives';
        } elseif ( 'licences-renouvellement' === $section ) {
            $url = add_query_arg( array( 'ufsc_section' => 'licences-renouvellement' ), $url ) . '#ufsc-renouvellement';
        } elseif ( isset( $anchors[ $section ] ) ) {
            $url .= '#' . $anchors[ $section ];
        }
"""
          new = """        if ( in_array( $section, array( 'licences', 'club-licences' ), true ) ) {
            $url = add_query_arg( 'ufsc_section', 'club-licences', $url ) . '#ufsc-club-licences';
        } elseif ( 'licences-archives' === $section ) {
            $url = add_query_arg( 'ufsc_section', 'licences-archives', $url ) . '#ufsc-licences-archives';
        } elseif ( 'licences-renouvellement' === $section ) {
            $url = add_query_arg( array( 'ufsc_section' => 'licences-renouvellement' ), $url ) . '#ufsc-renouvellement';
        } elseif ( isset( $anchors[ $section ] ) ) {
            $url .= '#' . $anchors[ $section ];
        }
"""
          if old not in text:
              raise SystemExit('portal route block not found')
          text = text.replace(old, new, 1)

          old = """        $args = array_merge( (array) $filters, array( 'season' => $source_season, 'status' => 'valide', 'page' => 1, 'per_page' => 5000 ) );
"""
          new = """        $args = array_merge( (array) $filters, array( 'season' => $source_season, 'page' => 1, 'per_page' => 5000 ) );
"""
          if old not in text:
              raise SystemExit('renewable sources filter not found')
          front.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patched sources and remove temporary workflow
        run: |
          rm .github/workflows/temp-patch-renewal-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/core/class-ufsc-renewal-service.php includes/frontend/class-frontend-shortcodes.php .github/workflows/temp-patch-renewal-policy.yml
          git commit -m "fix: allow pending historical renewals and force licences route"
          git push origin HEAD:hotfix/production-renewal-affiliation-20260820

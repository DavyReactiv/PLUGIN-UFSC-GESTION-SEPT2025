name: Finalize pack summary
on:
  push:
    branches: [ agent/licence-flow-levels-ux ]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/licence-flow-levels-ux
          fetch-depth: 0
      - run: python3 .github/scripts/finalize-pack-summary.py
      - name: Validate
        run: |
          php -l includes/frontend/class-frontend-shortcodes.php
          php tests/test-licence-flow-levels-ux-static.php
          chmod +x tests/run-tests.sh
          tests/run-tests.sh
      - name: Clean and commit
        run: |
          rm -f .github/scripts/finalize-pack-summary.py .github/workflows/finalize-pack-summary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clarify ten-licence affiliation quota in club portal'
          git push origin HEAD:agent/licence-flow-levels-ux

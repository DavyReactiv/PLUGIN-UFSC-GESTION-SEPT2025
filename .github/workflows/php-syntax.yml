name: PHP syntax and runtime guards

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Lint PHP files outside vendor
        run: find . -path ./vendor -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Runtime and static critical tests
        run: |
          php tests/test-frontend-shortcodes-load.php
          php tests/test-compte-club-ui-static.php
          php tests/test-affiliation-product-4823-static.php
          php tests/test-affiliation-product-4823-runtime.php
          php tests/test-renewal-season-static.php
          php tests/test-final-stabilization-static.php
          php tests/test-licence-affiliation-gate-runtime.php

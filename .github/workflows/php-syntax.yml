name: PHP syntax and runtime guards

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Lint PHP files outside vendor
        run: find . -path ./vendor -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: find assets -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Runtime, static and PHPUnit-aware test runner
        run: |
          chmod +x tests/run-tests.sh
          tests/run-tests.sh

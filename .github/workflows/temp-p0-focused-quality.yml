name: TEMP P0 focused quality

on:
  push:
    branches:
      - fix/p0-licence-root-causes
    paths:
      - .github/workflows/temp-p0-focused-quality.yml

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Record focused findings
        shell: bash
        run: |
          set +e
          mkdir -p ci
          out=ci/p0-focused-quality.txt
          : > "$out"
          echo '===== PHPSTAN NEW FINALIZATION =====' >> "$out"
          vendor/bin/phpstan analyse -c phpstan.neon --no-progress --memory-limit=1G inc/common/licence-finalization-runtime.php includes/core/class-ufsc-licence-finalization-service.php >> "$out" 2>&1
          echo "exit=$?" >> "$out"
          echo '===== WPCS NEW FINALIZATION =====' >> "$out"
          vendor/bin/phpcs --standard=phpcs.xml.dist inc/common/licence-finalization-runtime.php includes/core/class-ufsc-licence-finalization-service.php >> "$out" 2>&1
          echo "exit=$?" >> "$out"
          echo '# rerun after nonce and prepared-SQL fixes' >> "$out"
          cat "$out"
      - name: Commit focused report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/p0-focused-quality.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: temporary focused quality report [skip ci]"
          git push

name: Audit licence flow

on:
  push:
    branches: [ agent/licence-flow-levels-ux ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fighter level references
        run: |
          echo '=== fighter_level refs ==='
          grep -R -n -C 4 --exclude-dir=.git -E "fighter_level|sport_level|Niveau sportif|niveau sportif" inc includes templates assets tests | head -n 500 || true
      - name: Pack and cart references
        run: |
          echo '=== pack/cart refs ==='
          grep -R -n -C 4 --exclude-dir=.git -E "allocate_pack|pack_credit|included.*pack|quota|10 licence|add_to_cart|Ajouter au panier|wc_get_cart_url" inc includes templates assets tests | head -n 700 || true
      - name: Navigation references
        run: |
          echo '=== club nav refs ==='
          grep -R -n -C 3 --exclude-dir=.git -E "ufsc-club-account__nav|Règlements sportifs|Archives licences" assets/css includes/frontend | head -n 300 || true

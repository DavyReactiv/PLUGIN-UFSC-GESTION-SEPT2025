name: P0 structural patch PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/p0-structural-licence-stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Execute structural patch source
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/p0-structural-patch.yml').read_text(encoding='utf-8')
          anchor = '      - name: Apply canonical workflow patch\n        shell: python\n        run: |\n'
          if anchor not in source:
              raise SystemExit('embedded structural patch source not found')
          payload = source.split(anchor, 1)[1].split('      - name: Commit structural patch\n', 1)[0]
          lines = payload.splitlines()
          payload = '\n'.join((line[10:] if line.startswith('          ') else line) for line in lines) + '\n'
          old_helper = """def one(text, old, new, label):
    count = text.count(old)
    if count != 1:
        raise SystemExit(f'{label}: expected 1 exact match, got {count}')
    return text.replace(old, new, 1)
"""
          new_helper = """def one(text, old, new, label):
    count = text.count(old)
    if count == 1:
        return text.replace(old, new, 1)
    if count > 1:
        raise SystemExit(f'{label}: expected 1 exact match, got {count}')
    # Fallback is whitespace-tolerant only; punctuation, identifiers and literals remain exact.
    pieces = re.split(r'(\\s+)', old)
    pattern = ''.join(r'\\s+' if part and part.isspace() else re.escape(part) for part in pieces if part != '')
    out, relaxed = re.subn(pattern, lambda _m: new, text, count=1, flags=re.S)
    if relaxed != 1:
        raise SystemExit(f'{label}: expected 1 whitespace-normalized match, got {relaxed}')
    return out
"""
          if old_helper not in payload:
              raise SystemExit('patch helper definition not found')
          payload = payload.replace(old_helper, new_helper, 1)
          exec(compile(payload, 'p0-structural-patch.py', 'exec'), {})
      - name: Commit canonical structural changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/core/class-unified-handlers.php includes/frontend/class-frontend-shortcodes.php inc/common/feature-flags.php inc/common/club-dashboard-hardening.php inc/common/club-journey.php assets/css/ufsc-club-journey.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: stabilize canonical licence workflow and portal routes"
          git push origin HEAD:${{ github.head_ref }}

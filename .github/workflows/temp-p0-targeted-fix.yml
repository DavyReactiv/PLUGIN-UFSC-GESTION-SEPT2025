name: TEMP targeted P0 source repair

on:
  push:
    branches:
      - fix/p0-licence-root-causes
    paths:
      - .github/workflows/temp-p0-targeted-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten PHPCS exception scopes
        shell: python
        run: |
          from pathlib import Path
          path = Path('inc/common/licence-finalization-runtime.php')
          src = path.read_text()

          pairs = [
              (
                  "\t\tself::finalize_for_unified_request( $licence_id, absint( $club_id ), 'unified_update' );\n\t}\n\n\t/**\n\t * Finalise the current-season target row",
                  "\t\tself::finalize_for_unified_request( $licence_id, absint( $club_id ), 'unified_update' );\n\t}\n\t// phpcs:enable WordPress.Security.NonceVerification.Missing\n\n\t/**\n\t * Finalise the current-season target row"
              ),
              (
                  "\tprivate static function is_renewal_final_request() {",
                  "\t// phpcs:disable WordPress.Security.NonceVerification.Missing -- Renewal target filter runs only after the Woo/admin-post nonce check.\n\tprivate static function is_renewal_final_request() {"
              ),
              (
                  "\t\treturn in_array( $intent, array( 'add_to_cart', 'submit_for_validation', 'finalize' ), true );\n\t}\n\n\t/**\n\t * The service has already made the payable decision",
                  "\t\treturn in_array( $intent, array( 'add_to_cart', 'submit_for_validation', 'finalize' ), true );\n\t}\n\t// phpcs:enable WordPress.Security.NonceVerification.Missing\n\n\t/**\n\t * The service has already made the payable decision"
              ),
              (
                  "\t\t\t$_POST['ufsc_submit_action'] = 'continue';",
                  "\t\t\t// phpcs:ignore WordPress.Security.NonceVerification.Missing -- This post-save request has already passed the controller nonce check.\n\t\t\t$_POST['ufsc_submit_action'] = 'continue';"
              ),
              (
                  "\t\treturn 'add_to_cart' === $intent || 'submit_for_validation' === $final_intent;\n\t}\n\n\t/**\n\t * Rewrite only the success/error redirect",
                  "\t\treturn 'add_to_cart' === $intent || 'submit_for_validation' === $final_intent;\n\t}\n\t// phpcs:enable WordPress.Security.NonceVerification.Missing\n\n\t/**\n\t * Rewrite only the success/error redirect"
              ),
              (
                  "\t\treturn add_query_arg(\n\t\t\tarray(\n\t\t\t\t'ufsc_message'      => 'licence_included',\n\t\t\t\t'licence_included' => 1,\n\t\t\t\t'licence_id'       => $licence_id,\n\t\t\t\t'pack_bucket'      => sanitize_key( (string) ( $result['bucket'] ?? 'libre' ) ),\n\t\t\t),\n\t\t\t$location\n\t\t);\n\t}\n\n\tprivate static function is_unified_request_action()",
                  "\t\treturn add_query_arg(\n\t\t\tarray(\n\t\t\t\t'ufsc_message'      => 'licence_included',\n\t\t\t\t'licence_included' => 1,\n\t\t\t\t'licence_id'       => $licence_id,\n\t\t\t\t'pack_bucket'      => sanitize_key( (string) ( $result['bucket'] ?? 'libre' ) ),\n\t\t\t),\n\t\t\t$location\n\t\t);\n\t}\n\t// phpcs:enable WordPress.Security.NonceVerification.Missing\n\n\tprivate static function is_unified_request_action()"
              ),
              (
                  "\t\treturn in_array( $action, array( 'ufsc_add_licence', 'ufsc_save_licence', 'ufsc_update_licence' ), true );\n\t}\n\n\tprivate static function resolved_result_licence_id()",
                  "\t\treturn in_array( $action, array( 'ufsc_add_licence', 'ufsc_save_licence', 'ufsc_update_licence' ), true );\n\t}\n\t// phpcs:enable WordPress.Security.NonceVerification.Missing\n\n\tprivate static function resolved_result_licence_id()"
              ),
              (
                  "\t\treturn $ids ? absint( end( $ids ) ) : 0;\n\t}\n\n\t/**\n\t * Canonical replacement for the Journey finalisation endpoint.",
                  "\t\treturn $ids ? absint( end( $ids ) ) : 0;\n\t}\n\t// phpcs:enable WordPress.Security.NonceVerification.Missing\n\n\t/**\n\t * Canonical replacement for the Journey finalisation endpoint."
              ),
          ]

          for old, new in pairs:
              if old not in src:
                  raise SystemExit(f'Target missing: {old[:90]}')
              src = src.replace(old, new, 1)

          path.write_text(src)

      - name: Verify PHP syntax
        run: php -l inc/common/licence-finalization-runtime.php
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inc/common/licence-finalization-runtime.php
          git diff --cached --quiet && exit 0
          git commit -m "quality: scope nonce exclusions to verified request observers [skip ci]"
          git push

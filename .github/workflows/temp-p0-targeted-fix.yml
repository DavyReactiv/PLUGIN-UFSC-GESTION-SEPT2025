name: TEMP targeted P0 source repair

on:
  push:
    branches:
      - fix/p0-licence-root-causes
    paths:
      - .github/workflows/temp-p0-targeted-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote submit_for_validation to canonical intent
        shell: python
        run: |
          from pathlib import Path
          path = Path('includes/core/class-unified-handlers.php')
          src = path.read_text()
          old = "return in_array( $action, array( 'save_draft', 'continue', 'verify', 'add_to_cart' ), true ) ? $action : 'continue';"
          new = "return in_array( $action, array( 'save_draft', 'continue', 'verify', 'submit_for_validation', 'add_to_cart' ), true ) ? $action : 'continue';"
          if old not in src:
              raise SystemExit('Unified intent target missing; refusing broad edit.')
          path.write_text(src.replace(old, new, 1))
      - name: Verify PHP syntax
        run: php -l includes/core/class-unified-handlers.php
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/core/class-unified-handlers.php
          git diff --cached --quiet && exit 0
          git commit -m "fix: make submit_for_validation a canonical licence intent [skip ci]"
          git push

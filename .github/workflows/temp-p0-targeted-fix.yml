name: TEMP targeted P0 source repair

on:
  push:
    branches:
      - fix/p0-licence-root-causes
    paths:
      - .github/workflows/temp-p0-targeted-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused private season helper
        shell: python
        run: |
          from pathlib import Path
          path = Path('includes/core/class-ufsc-season-service.php')
          src = path.read_text()
          dead = '''\n    /** Normalize legacy parse inputs without recursively calling normalize_season(). */\n    private static function normalize_parse_input( $season ) {\n        $season = trim( str_replace( '/', '-', (string) $season ) );\n        if ( preg_match( '/^\\d{4}$/', $season ) ) {\n            $end = (int) $season;\n            return sprintf( '%d-%d', $end - 1, $end );\n        }\n        return $season;\n    }\n'''
          if dead not in src:
              raise SystemExit('Unused season helper not found; refusing broad edit.')
          path.write_text(src.replace(dead, '\n', 1))
      - name: Verify PHP syntax
        run: php -l includes/core/class-ufsc-season-service.php
      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/core/class-ufsc-season-service.php
          git diff --cached --quiet && exit 0
          git commit -m "quality: remove unused private season parser helper [skip ci]"
          git push

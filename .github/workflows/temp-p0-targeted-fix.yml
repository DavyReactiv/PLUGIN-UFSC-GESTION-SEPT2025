name: TEMP targeted P0 source repair

on:
  push:
    branches:
      - fix/p0-licence-root-causes
    paths:
      - .github/workflows/temp-p0-targeted-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrowly scoped quality fixes
        shell: python
        run: |
          from pathlib import Path

          service = Path('includes/core/class-ufsc-licence-finalization-service.php')
          src = service.read_text()
          replacements = {
              '$wpdb->prepare( "SELECT * FROM `{$table}` WHERE id = %d", $licence_id )': '$wpdb->prepare( "SELECT * FROM %i WHERE id = %d", $table, $licence_id )',
              '$wpdb->get_col( "DESCRIBE `{$table}`" )': '$wpdb->get_col( $wpdb->prepare( "DESCRIBE %i", $table ) )',
              '$wpdb->prepare( "SELECT submitted_at FROM `{$table}` WHERE id = %d", $licence_id )': '$wpdb->prepare( "SELECT submitted_at FROM %i WHERE id = %d", $table, $licence_id )',
              '$wpdb->prepare( "SELECT * FROM `{$table}` WHERE id = %d AND club_id = %d", $licence_id, $club_id )': '$wpdb->prepare( "SELECT * FROM %i WHERE id = %d AND club_id = %d", $table, $licence_id, $club_id )',
          }
          for old, new in replacements.items():
              if old not in src:
                  raise SystemExit(f'Service target missing: {old}')
              src = src.replace(old, new, 1)
          service.write_text(src)

          runtime = Path('inc/common/licence-finalization-runtime.php')
          src = runtime.read_text()
          old = "\tpublic static function normalize_final_intent_post() {\n\t\tif ( 'POST' !== strtoupper( sanitize_text_field( wp_unslash( $_SERVER['REQUEST_METHOD'] ?? '' ) ) ) ) {\n\t\t\treturn;\n\t\t}\n\n\t\t$action ="
          new = "\tpublic static function normalize_final_intent_post() {\n\t\tif ( 'POST' !== strtoupper( sanitize_text_field( wp_unslash( $_SERVER['REQUEST_METHOD'] ?? '' ) ) ) ) {\n\t\t\treturn;\n\t\t}\n\n\t\t$nonce = isset( $_POST['_wpnonce'] ) && ! is_array( $_POST['_wpnonce'] ) ? sanitize_text_field( wp_unslash( $_POST['_wpnonce'] ) ) : '';\n\t\t$valid_nonce = $nonce && ( wp_verify_nonce( $nonce, 'ufsc_add_licence' ) || wp_verify_nonce( $nonce, 'ufsc_save_licence' ) || wp_verify_nonce( $nonce, 'ufsc_update_licence' ) );\n\t\tif ( ! $valid_nonce ) {\n\t\t\treturn;\n\t\t}\n\n\t\t$action ="
          if old not in src:
              raise SystemExit('Runtime nonce target missing')
          src = src.replace(old, new, 1)

          scoped = {
              "\tpublic static function finalize_updated_licence( $club_id ) {": "\t// phpcs:disable WordPress.Security.NonceVerification.Missing -- Post-save observer runs only after the Unified Handler nonce check.\n\tpublic static function finalize_updated_licence( $club_id ) {",
              "\tprivate static function is_unified_final_request() {": "\tprivate static function is_unified_final_request() {\n\t\t// phpcs:disable WordPress.Security.NonceVerification.Missing -- Called only from post-save observers after controller nonce verification.",
              "\tpublic static function rewrite_unified_redirect( $location, $status = 302 ) {": "\t// phpcs:disable WordPress.Security.NonceVerification.Missing -- Redirect filter is evaluated in the already verified admin-post request.\n\tpublic static function rewrite_unified_redirect( $location, $status = 302 ) {",
              "\tprivate static function is_unified_request_action() {": "\tprivate static function is_unified_request_action() {\n\t\t// phpcs:disable WordPress.Security.NonceVerification.Missing -- Helper is used only during the verified admin-post lifecycle.",
              "\tprivate static function resolved_result_licence_id() {": "\tprivate static function resolved_result_licence_id() {\n\t\t// phpcs:disable WordPress.Security.NonceVerification.Missing -- Helper is used only during the verified admin-post lifecycle.",
          }
          for old, new in scoped.items():
              if old not in src:
                  raise SystemExit(f'Runtime scoped target missing: {old}')
              src = src.replace(old, new, 1)

          old = "\t\t$licence_id = isset( $_POST['licence_id'] ) && ! is_array( $_POST['licence_id'] )\n\t\t\t? absint( wp_unslash( $_POST['licence_id'] ) )\n\t\t\t: 0;\n\t\tcheck_admin_referer( 'ufsc_journey_finalize_' . $licence_id );"
          new = "\t\t// phpcs:disable WordPress.Security.NonceVerification.Missing -- Licence ID is required to derive the nonce action and is verified immediately below.\n\t\t$licence_id = isset( $_POST['licence_id'] ) && ! is_array( $_POST['licence_id'] )\n\t\t\t? absint( wp_unslash( $_POST['licence_id'] ) )\n\t\t\t: 0;\n\t\t// phpcs:enable WordPress.Security.NonceVerification.Missing\n\t\tcheck_admin_referer( 'ufsc_journey_finalize_' . $licence_id );"
          if old not in src:
              raise SystemExit('Journey nonce target missing')
          src = src.replace(old, new, 1)
          runtime.write_text(src)

      - name: Verify PHP syntax
        run: |
          php -l includes/core/class-ufsc-licence-finalization-service.php
          php -l inc/common/licence-finalization-runtime.php
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/core/class-ufsc-licence-finalization-service.php inc/common/licence-finalization-runtime.php
          git diff --cached --quiet && exit 0
          git commit -m "quality: harden finalization nonce and prepared SQL [skip ci]"
          git push

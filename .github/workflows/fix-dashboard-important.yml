name: Fix dashboard important guards

on:
  push:
    branches:
      - agent/restore-club-dashboard-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-club-dashboard-ui
          fetch-depth: 0
      - name: Remove important only from restored dashboard block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/ufsc-front.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Final portal layout precedence.'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('restored dashboard marker not found')
          head = text[:start]
          tail = text[start:].replace(' !important', '')
          path.write_text(head + tail, encoding='utf-8')
          print('important total after fix:', (head + tail).count('!important'))
          PY
      - name: Validate guard
        run: php tests/test-club-portal-color-contrast-static.php
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-dashboard-important.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/ufsc-front.css .github/workflows/fix-dashboard-important.yml
          git commit -m 'Fix restored dashboard CSS guards'
          git push origin HEAD:agent/restore-club-dashboard-ui

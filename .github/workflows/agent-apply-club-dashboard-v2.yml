name: Agent apply club dashboard v2
on:
  push:
    branches:
      - agent/club-dashboard-traceability-v2
    paths:
      - .github/workflows/agent-apply-club-dashboard-v2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/club-dashboard-traceability-v2
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path); text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{label}: pattern not found in {path}')
              p.write_text(text.replace(old, new, 1))

          # --- Database: additive licence traceability, no historical backfill ---
          p = Path('includes/core/class-ufsc-db-migrations.php')
          text = p.read_text()
          text = text.replace("const MIGRATION_VERSION = '1.5.0';", "const MIGRATION_VERSION = '1.6.0';", 1)
          marker = """        $attestations_option     = 'ufsc_attestations_table_ready';
"""
          insertion = marker + """
        // Always retry additive traceability columns. This never backfills dates.
        self::ensure_licence_traceability_columns();
"""
          if marker not in text: raise SystemExit('migration bootstrap marker missing')
          text = text.replace(marker, insertion, 1)
          method_marker = """    /**
     * Ensure licences table supports soft delete.
     */
"""
          method = """    /** Additive licence chronology columns; existing rows remain untouched. */
    public static function ensure_licence_traceability_columns() {
        $settings = UFSC_SQL::get_settings();
        self::add_columns_if_missing( $settings['table_licences'], array(
            'submitted_at' => 'datetime NULL DEFAULT NULL',
            'validated_at' => 'datetime NULL DEFAULT NULL',
            'validated_by' => 'bigint(20) unsigned NULL DEFAULT NULL',
        ) );
    }

""" + method_marker
          if method_marker not in text: raise SystemExit('migration method marker missing')
          text = text.replace(method_marker, method, 1)
          p.write_text(text)

          # --- Front licence save: immutable creation already exists; stamp first submission only ---
          p = Path('includes/core/class-unified-handlers.php')
          text = p.read_text()
          marker = """        $data = self::add_detected_category_fields( $data, $column_exists );
        $current_season ="""
          insertion = """        $data = self::add_detected_category_fields( $data, $column_exists );

        // First submission timestamp is server-managed and never rewrites history.
        $submit_intent = isset( $_POST['ufsc_submit_action'] ) ? sanitize_key( wp_unslash( $_POST['ufsc_submit_action'] ) ) : '';
        if ( $column_exists( 'submitted_at' ) && in_array( $submit_intent, array( 'add_to_cart', 'submit', 'finalize' ), true ) ) {
            $existing_submitted_at = '';
            if ( $licence_id > 0 ) {
                $existing_submitted_at = (string) $wpdb->get_var( $wpdb->prepare( "SELECT submitted_at FROM `{$licences_table}` WHERE id = %d", $licence_id ) );
            }
            if ( '' === trim( $existing_submitted_at ) || '0000-00-00 00:00:00' === $existing_submitted_at ) {
                $data['submitted_at'] = current_time( 'mysql' );
            }
        }
        $current_season ="""
          if marker not in text: raise SystemExit('unified traceability marker missing')
          p.write_text(text.replace(marker, insertion, 1))

          # --- Admin save: stamp validation transition, preserve date_creation and prior validation ---
          p = Path('includes/admin/class-sql-admin.php')
          text = p.read_text()
          marker = """        $data = self::add_detected_category_fields_for_admin_save( $t, $pk, $data, $id );

        // Upload certificat"""
          insertion = """        $data = self::add_detected_category_fields_for_admin_save( $t, $pk, $data, $id );

        // Chronology is additive: never replace date_creation or an existing validation stamp.
        $trace_columns = self::get_table_columns( $t );
        $next_trace_status = isset( $data['statut'] ) && function_exists( 'ufsc_normalize_license_status' )
            ? ufsc_normalize_license_status( $data['statut'] )
            : sanitize_key( (string) ( $data['statut'] ?? '' ) );
        $previous_trace_status = '';
        if ( $id && in_array( 'statut', $trace_columns, true ) ) {
            $previous_trace_status = (string) $wpdb->get_var( $wpdb->prepare( "SELECT statut FROM `{$t}` WHERE `{$pk}` = %d", $id ) );
            $previous_trace_status = function_exists( 'ufsc_normalize_license_status' ) ? ufsc_normalize_license_status( $previous_trace_status ) : sanitize_key( $previous_trace_status );
        }
        if ( in_array( 'submitted_at', $trace_columns, true ) && in_array( $next_trace_status, array( 'en_attente', 'valide' ), true ) ) {
            $existing_submitted_at = $id ? (string) $wpdb->get_var( $wpdb->prepare( "SELECT submitted_at FROM `{$t}` WHERE `{$pk}` = %d", $id ) ) : '';
            if ( '' === trim( $existing_submitted_at ) || '0000-00-00 00:00:00' === $existing_submitted_at ) {
                $data['submitted_at'] = current_time( 'mysql' );
            }
        }
        if ( 'valide' === $next_trace_status && 'valide' !== $previous_trace_status ) {
            if ( in_array( 'validated_at', $trace_columns, true ) ) { $data['validated_at'] = current_time( 'mysql' ); }
            if ( in_array( 'validated_by', $trace_columns, true ) ) { $data['validated_by'] = get_current_user_id(); }
        }

        // Upload certificat"""
          if marker not in text: raise SystemExit('admin trace marker missing')
          text = text.replace(marker, insertion, 1)

          # Admin list: explicit chronology instead of a silent blank / obsolete-looking date.
          old = """        echo '<th class=\"column-date\">' . esc_html__('Date création', 'ufsc-clubs') . '</th>';
        echo '<th class=\"column-actions\">' . esc_html__('Actions', 'ufsc-clubs') . '</th>';"""
          new = """        echo '<th class=\"column-date\">' . esc_html__('Date création', 'ufsc-clubs') . '</th>';
        echo '<th class=\"column-date\">' . esc_html__('Validation admin', 'ufsc-clubs') . '</th>';
        echo '<th class=\"column-actions\">' . esc_html__('Actions', 'ufsc-clubs') . '</th>';"""
          if old not in text: raise SystemExit('admin chronology header marker missing')
          text = text.replace(old,new,1)
          old = """                echo '<td>' . esc_html($r->date_creation ?: '') . '</td>';
                echo '<td class=\"column-actions\">';"""
          new = """                $creation_display = ! empty( $r->date_creation ) && '0000-00-00 00:00:00' !== $r->date_creation ? $r->date_creation : __( 'Historique : date indisponible', 'ufsc-clubs' );
                echo '<td>' . esc_html( $creation_display ) . '</td>';
                $validation_display = ! empty( $r->validated_at ) && '0000-00-00 00:00:00' !== $r->validated_at ? $r->validated_at : ( 'valide' === $normalized_status ? __( 'Historique : validation non datée', 'ufsc-clubs' ) : '—' );
                if ( ! empty( $r->validated_by ) ) { $validation_display .= ' · #' . absint( $r->validated_by ); }
                echo '<td>' . esc_html( $validation_display ) . '</td>';
                echo '<td class=\"column-actions\">';"""
          if old not in text: raise SystemExit('admin chronology row marker missing')
          p.write_text(text.replace(old,new,1))

          # --- Annual affiliation: validation date/by is immutable once active ---
          p = Path('includes/core/class-ufsc-season-archive-manager.php')
          text = p.read_text()
          old = """\t\t\t'validated_at' => 'active' === $status ? $now : ( $existing->validated_at ?? null ),
\t\t\t'validated_by' => 'active' === $status ? $user_id : ( $existing->validated_by ?? null ),"""
          new = """\t\t\t'validated_at' => ( 'active' === $status && ( ! $existing || ! in_array( self::normalize_status( $existing->status ?? '' ), array( 'active', 'validated' ), true ) ) ) ? $now : ( $existing->validated_at ?? null ),
\t\t\t'validated_by' => ( 'active' === $status && ( ! $existing || ! in_array( self::normalize_status( $existing->status ?? '' ), array( 'active', 'validated' ), true ) ) ) ? $user_id : ( $existing->validated_by ?? null ),"""
          if old not in text: raise SystemExit('annual validation marker missing')
          p.write_text(text.replace(old,new,1))

          # --- Account/profile: exact missing actions, not only counters ---
          p = Path('includes/frontend/class-frontend-shortcodes.php')
          text = p.read_text()
          old = """                $profile_docs_fields = array( 'doc_statuts', 'doc_recepisse', 'doc_jo', 'doc_pv_ag', 'doc_cer', 'doc_attestation_cer' );
                $profile_missing_docs = 0;
                foreach ( $profile_docs_fields as $profile_doc_key ) {
                    $profile_doc_value = isset( $club->$profile_doc_key ) ? $club->$profile_doc_key : '';
                    if ( empty( $profile_doc_value ) || ! wp_get_attachment_url( $profile_doc_value ) ) {
                        $profile_missing_docs++;
                    }
                }
"""
          new = """                $profile_docs_fields = array(
                    'doc_statuts' => __( 'Statuts de l’association', 'ufsc-clubs' ),
                    'doc_recepisse' => __( 'Récépissé de déclaration', 'ufsc-clubs' ),
                    'doc_jo' => __( 'Publication au Journal Officiel', 'ufsc-clubs' ),
                    'doc_pv_ag' => __( 'Procès-verbal d’assemblée générale', 'ufsc-clubs' ),
                    'doc_cer' => __( 'Contrat d’engagement républicain', 'ufsc-clubs' ),
                    'doc_attestation_cer' => __( 'Attestation CER', 'ufsc-clubs' ),
                );
                $profile_missing_docs = 0;
                $profile_missing_doc_labels = array();
                foreach ( $profile_docs_fields as $profile_doc_key => $profile_doc_label ) {
                    $profile_doc_value = isset( $club->$profile_doc_key ) ? $club->$profile_doc_key : '';
                    if ( empty( $profile_doc_value ) || ! wp_get_attachment_url( $profile_doc_value ) ) {
                        $profile_missing_docs++;
                        $profile_missing_doc_labels[] = $profile_doc_label;
                    }
                }
"""
          if old not in text: raise SystemExit('profile docs marker missing')
          text = text.replace(old,new,1)
          marker = """            <form method=\"post\" action=\"<?php echo esc_url( admin_url( 'admin-post.php' ) ); ?>\" enctype=\"multipart/form-data\" class=\"ufsc-club-form ufsc-club-profile\">"""
          action_box = """            <?php if ( $profile_missing_roles || $profile_missing_docs ) : ?>
                <section class=\"ufsc-card ufsc-profile-actions\" aria-labelledby=\"ufsc-profile-actions-title\">
                    <div class=\"ufsc-profile-actions__heading\"><h4 id=\"ufsc-profile-actions-title\"><?php esc_html_e( 'Éléments à compléter', 'ufsc-clubs' ); ?></h4><p><?php esc_html_e( 'Corrigez directement les éléments ci-dessous pour garder le profil du club à jour.', 'ufsc-clubs' ); ?></p></div>
                    <ul>
                        <?php foreach ( (array) ( $profile_bureau['missing_labels'] ?? array() ) as $missing_role_label ) : ?><li><span>👥 <?php echo esc_html( $missing_role_label ); ?></span><a class=\"ufsc-btn ufsc-btn-secondary\" href=\"<?php echo esc_url( self::get_club_portal_url( 'club-officers' ) ); ?>\"><?php esc_html_e( 'Compléter', 'ufsc-clubs' ); ?></a></li><?php endforeach; ?>
                        <?php foreach ( $profile_missing_doc_labels as $missing_doc_label ) : ?><li><span>📄 <?php echo esc_html( $missing_doc_label ); ?></span><a class=\"ufsc-btn ufsc-btn-secondary\" href=\"<?php echo esc_url( self::get_club_portal_url( 'club-documents' ) ); ?>\"><?php esc_html_e( 'Ajouter', 'ufsc-clubs' ); ?></a></li><?php endforeach; ?>
                    </ul>
                </section>
            <?php else : ?>
                <div class=\"ufsc-message ufsc-success ufsc-profile-complete\"><strong><?php esc_html_e( 'Profil club complet', 'ufsc-clubs' ); ?></strong> <?php esc_html_e( 'Aucune action requise actuellement.', 'ufsc-clubs' ); ?></div>
            <?php endif; ?>
""" + marker
          if marker not in text: raise SystemExit('profile form marker missing')
          text = text.replace(marker, action_box, 1)

          # Demographic percentages already use official-only stats; denominator must match validated total.
          text = text.replace("$profile_total = max( 0, (int) ( $stats['total_licences'] ?? 0 ) );", "$profile_total = max( 0, (int) ( $stats['validated_licences'] ?? 0 ) );", 1)
          p.write_text(text)

          # --- Mobile contract from iPhone screenshots, no !important ---
          p = Path('assets/css/ufsc-front.css')
          text = p.read_text()
          mobile = r'''

/* UFSC Compte Club — mobile containment and actionable profile alerts */
.ufsc-club-portal :is(.ufsc-club-profile-shell,.ufsc-club-profile-layout,.ufsc-club-profile-main,.ufsc-club-hero,.ufsc-card,.ufsc-field,.ufsc-profile-insight-band,.ufsc-section-header) { min-inline-size: 0; max-inline-size: 100%; }
.ufsc-club-portal :is(input,select,textarea,.ufsc-permission-notice,.ufsc-club-account__identity dd,.ufsc-club-account__identity a) { max-inline-size: 100%; }
.ufsc-club-portal .ufsc-club-account__identity :is(dd,a), .ufsc-club-portal .ufsc-field :is(input,select,textarea) { overflow-wrap: anywhere; }
.ufsc-club-portal .ufsc-profile-actions { display: grid; gap: 14px; margin-block: 16px; }
.ufsc-club-portal .ufsc-profile-actions__heading :is(h4,p) { margin-block: 0 6px; }
.ufsc-club-portal .ufsc-profile-actions ul { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.ufsc-club-portal .ufsc-profile-actions li { align-items: center; border-top: 1px solid #dbe3ed; display: grid; gap: 10px; grid-template-columns: minmax(0,1fr) auto; padding-top: 10px; }
@media (max-width: 767px) {
 .ufsc-club-portal { inline-size: calc(100% - 20px); margin-inline: auto; max-inline-size: 100%; overflow-x: clip; }
 .ufsc-club-portal .ufsc-club-profile-shell { inline-size: 100%; overflow-x: clip; }
 .ufsc-club-portal .ufsc-section-header.ufsc-profile-header { gap: 14px; padding: 22px 18px; }
 .ufsc-club-portal .ufsc-section-header.ufsc-profile-header :is(h3,p) { max-inline-size: 100%; overflow-wrap: anywhere; }
 .ufsc-club-portal .ufsc-permission-notice { inline-size: 100%; margin: 0; }
 .ufsc-club-portal .ufsc-club-hero { grid-template-columns: minmax(0,1fr); padding: 14px; }
 .ufsc-club-portal .ufsc-logo-editor { grid-template-columns: minmax(0,1fr); justify-items: stretch; }
 .ufsc-club-portal .ufsc-logo-editor__preview { grid-row: auto; justify-self: center; max-inline-size: min(100%, 320px); }
 .ufsc-club-portal .ufsc-logo-editor__remove { grid-column: auto; }
 .ufsc-club-portal .ufsc-logo-editor__upload :is(.ufsc-btn,.ufsc-logo-editor__file) { inline-size: 100%; min-inline-size: 0; }
 .ufsc-club-portal .ufsc-profile-insight-band { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
 .ufsc-club-portal .ufsc-profile-insight { padding: 14px; }
 .ufsc-club-portal .ufsc-profile-cards > .ufsc-card { padding: 18px 14px; }
 .ufsc-club-portal .ufsc-field :is(input,select,textarea) { box-sizing: border-box; inline-size: 100%; min-inline-size: 0; }
 .ufsc-club-portal .ufsc-profile-actions li { grid-template-columns: minmax(0,1fr); }
 .ufsc-club-portal .ufsc-profile-actions .ufsc-btn { inline-size: 100%; min-inline-size: 0; }
}
@media (max-width: 420px) {
 .ufsc-club-portal .ufsc-profile-insight-band { grid-template-columns: minmax(0,1fr); }
 .ufsc-club-portal .ufsc-club-account__nav.ufsc-club-portal__nav { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
'''
          if 'UFSC Compte Club — mobile containment' not in text:
              text += mobile
          p.write_text(text)

          # --- Static safeguards, including cart rules that must not regress ---
          Path('tests/test-club-dashboard-traceability-v2-static.php').write_text(r'''<?php
          $root = dirname(__DIR__);
          $migration = file_get_contents($root . '/includes/core/class-ufsc-db-migrations.php');
          $admin = file_get_contents($root . '/includes/admin/class-sql-admin.php');
          $front = file_get_contents($root . '/includes/frontend/class-frontend-shortcodes.php');
          $css = file_get_contents($root . '/assets/css/ufsc-front.css');
          $handlers = file_get_contents($root . '/includes/core/class-unified-handlers.php');
          $cart = file_get_contents($root . '/inc/woocommerce/cart-integration.php');
          $fail = static function($m){ fwrite(STDERR,"FAIL: $m\n"); exit(1); };
          strpos($migration,"'validated_at'") !== false || $fail('validated_at schema missing');
          strpos($migration,"'validated_by'") !== false || $fail('validated_by schema missing');
          strpos($handlers,"submitted_at") !== false || $fail('front submitted timestamp missing');
          strpos($admin,"Validation admin") !== false || $fail('admin validation chronology missing');
          strpos($admin,"Historique : date indisponible") !== false || $fail('historical unknown-date label missing');
          strpos($front,'Éléments à compléter') !== false || $fail('actionable profile alerts missing');
          strpos($css,'mobile containment and actionable profile alerts') !== false || $fail('mobile account contract missing');
          strpos($cart,'ufsc_allocate_pack_credit') !== false || $fail('canonical pack allocation missing');
          strpos($handlers,'ufsc_add_licence_ids_to_cart_idempotent') !== false || $fail('idempotent Woo cart route missing');
          echo "OK: club dashboard traceability v2 + cart regression guards\n";
          ''')
      - name: PHP syntax and targeted tests
        run: |
          php -l includes/core/class-ufsc-db-migrations.php
          php -l includes/core/class-unified-handlers.php
          php -l includes/admin/class-sql-admin.php
          php -l includes/core/class-ufsc-season-archive-manager.php
          php -l includes/frontend/class-frontend-shortcodes.php
          php tests/test-new-licence-cart-route-static.php
          php tests/test-licence-flow-levels-ux-static.php
          php tests/test-club-dashboard-traceability-v2-static.php
          if [ -x tests/run-tests.sh ]; then tests/run-tests.sh; fi
      - name: Commit changes
        run: |
          rm .github/workflows/agent-apply-club-dashboard-v2.yml
          git config user.name DavyReactiv
          git config user.email 193739217+DavyReactiv@users.noreply.github.com
          git add -A
          git commit -m "fix: finaliser traçabilité et responsive compte club"
          git push origin HEAD:agent/club-dashboard-traceability-v2

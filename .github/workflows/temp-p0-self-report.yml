name: TEMP P0 quality self-report

on:
  push:
    branches:
      - fix/p0-licence-root-causes
    paths-ignore:
      - ci/p0-quality-result.txt

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run and record quality commands
        shell: bash
        run: |
          set +e
          mkdir -p ci
          result="ci/p0-quality-result.txt"
          : > "$result"
          overall=0

          run_check() {
            name="$1"
            shift
            tmp="$(mktemp)"
            "$@" >"$tmp" 2>&1
            code=$?
            {
              echo "===== ${name} ====="
              echo "exit=${code}"
              cat "$tmp"
              echo
            } >> "$result"
            rm -f "$tmp"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          run_check "PHP LINT" bash -lc "find . -path ./vendor -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l"
          run_check "P0 REGRESSIONS" composer repro:p0
          run_check "STANDALONE" composer test:standalone
          run_check "PHPUNIT" composer test
          run_check "PHPSTAN" composer analyse
          run_check "WPCS" composer cs

          echo "OVERALL=${overall}" >> "$result"
          cat "$result"

      - name: Commit temporary report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/p0-quality-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: temporary P0 quality report [skip ci]"
          git push

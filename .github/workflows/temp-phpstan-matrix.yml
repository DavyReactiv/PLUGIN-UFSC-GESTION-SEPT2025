name: TEMP PHPStan file matrix

on:
  push:
    branches: [ fix/p0-licence-root-causes ]
    paths: [ .github/workflows/temp-phpstan-matrix.yml ]

permissions:
  contents: write

jobs:
  matrix-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test configured files individually
        shell: bash
        run: |
          set +e
          mkdir -p ci
          out=ci/phpstan-file-matrix.txt
          : > "$out"
          files=(
            inc/common/licence-status.php
            inc/common/compliance.php
            inc/common/fighter-level.php
            inc/common/licence-finalization-runtime.php
            inc/woocommerce/cart-integration.php
            includes/core/class-unified-handlers.php
            includes/core/class-ufsc-debug-trace.php
            includes/core/class-ufsc-licence-finalization-service.php
            includes/core/class-ufsc-licence-payments.php
            includes/core/class-ufsc-renewal-service.php
            includes/core/class-ufsc-season-service.php
            includes/front/class-ufsc-stats.php
          )
          for file in "${files[@]}"; do
            echo "===== $file =====" >> "$out"
            vendor/bin/phpstan analyse -c phpstan.neon --no-progress --memory-limit=1G "$file" >> "$out" 2>&1
            echo "exit=$?" >> "$out"
          done
          cat "$out"
      - name: Commit matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/phpstan-file-matrix.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: temporary PHPStan file matrix [skip ci]"
          git push

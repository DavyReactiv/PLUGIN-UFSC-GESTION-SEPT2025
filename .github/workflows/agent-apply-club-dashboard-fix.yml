name: Agent apply club dashboard fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/club-dashboard-traceability-responsive
      - name: Apply targeted patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          # 1) Demographics must represent official/validated licences only.
          p = Path('includes/front/class-ufsc-stats.php')
          text = p.read_text()
          old = """        $where_sql = implode( ' AND ', $where );
        $rows      = $wpdb->get_results(
            $wpdb->prepare(
                \"SELECT * FROM `{$licences_table}` WHERE {$where_sql}\",
                $params
            )
        );

        $total_licences     = count( $rows );
        $validated_licences = 0;
        $paid_licences      = 0;
        $draft_licences     = 0;
        $pending_payments   = 0;
        $by_status          = array();
        $by_gender          = array( 'M' => 0, 'F' => 0 );
        $by_age             = array( 'minor' => 0, 'adult' => 0 );
        $by_practice        = array( 'leisure' => 0, 'competition' => 0 );
        $by_birth_year      = array();

        foreach ( $rows as $row ) {
            $status_raw  = isset( $row->statut ) ? $row->statut : ( $row->status ?? '' );
            $status_norm = function_exists( 'ufsc_get_licence_status_norm' )
                ? ufsc_get_licence_status_norm( $status_raw )
                : strtolower( trim( (string) $status_raw ) );
            $by_status[ $status_norm ] = ( $by_status[ $status_norm ] ?? 0 ) + 1;

            if ( 'valide' === $status_norm ) {
                $validated_licences++;
            }
"""
          new = """        $where_sql = implode( ' AND ', $where );
        $rows      = $wpdb->get_results(
            $wpdb->prepare(
                \"SELECT * FROM `{$licences_table}` WHERE {$where_sql}\",
                $params
            )
        );

        $total_licences     = count( $rows );
        $validated_licences = 0;
        $paid_licences      = 0;
        $draft_licences     = 0;
        $pending_payments   = 0;
        $by_status          = array();
        $by_gender          = array( 'M' => 0, 'F' => 0 );
        $by_age             = array( 'minor' => 0, 'adult' => 0 );
        $by_practice        = array( 'leisure' => 0, 'competition' => 0 );
        $by_birth_year      = array();

        foreach ( $rows as $row ) {
            $status_raw  = isset( $row->statut ) ? $row->statut : ( $row->status ?? '' );
            $status_norm = function_exists( 'ufsc_get_licence_status_norm' )
                ? ufsc_get_licence_status_norm( $status_raw )
                : strtolower( trim( (string) $status_raw ) );
            $by_status[ $status_norm ] = ( $by_status[ $status_norm ] ?? 0 ) + 1;
            $is_validated = 'valide' === $status_norm;

            if ( $is_validated ) {
                $validated_licences++;
            }
"""
          if old not in text: raise SystemExit('stats header pattern missing')
          text = text.replace(old,new,1)
          old = """            $gender = strtoupper( trim( (string) ( $row->sexe ?? '' ) ) );
            if ( isset( $by_gender[ $gender ] ) ) {
                $by_gender[ $gender ]++;
            }

            $birth_date = trim( (string) ( $row->date_naissance ?? '' ) );
            if ( preg_match( '/^(\\d{4})-(\\d{2})-(\\d{2})$/', $birth_date, $matches ) ) {
                $birth_year = (int) $matches[1];
                $by_birth_year[ $birth_year ] = ( $by_birth_year[ $birth_year ] ?? 0 ) + 1;

                try {
                    $birth = new DateTimeImmutable( $birth_date );
                    $today = new DateTimeImmutable( current_time( 'Y-m-d' ) );
                    $age   = (int) $birth->diff( $today )->y;
                    $by_age[ $age < 18 ? 'minor' : 'adult' ]++;
                } catch ( Exception $e ) {
                    // Ignore invalid historical dates without mutating source data.
                }
            }

            $competition = isset( $row->competition ) ? (int) $row->competition : 0;
            $by_practice[ $competition ? 'competition' : 'leisure' ]++;
"""
          new = """            // Demographic/sporting KPIs describe official licences only. Draft,
            // pending and refused dossiers remain counted in total/by_status but must
            // not distort the active-season population profile.
            if ( $is_validated ) {
                $gender = strtoupper( trim( (string) ( $row->sexe ?? '' ) ) );
                if ( isset( $by_gender[ $gender ] ) ) {
                    $by_gender[ $gender ]++;
                }

                $birth_date = trim( (string) ( $row->date_naissance ?? '' ) );
                if ( preg_match( '/^(\\d{4})-(\\d{2})-(\\d{2})$/', $birth_date, $matches ) ) {
                    $birth_year = (int) $matches[1];
                    $by_birth_year[ $birth_year ] = ( $by_birth_year[ $birth_year ] ?? 0 ) + 1;

                    try {
                        $birth = new DateTimeImmutable( $birth_date );
                        $today = new DateTimeImmutable( current_time( 'Y-m-d' ) );
                        $age   = (int) $birth->diff( $today )->y;
                        $by_age[ $age < 18 ? 'minor' : 'adult' ]++;
                    } catch ( Exception $e ) {
                        // Ignore invalid historical dates without mutating source data.
                    }
                }

                $competition = isset( $row->competition ) ? (int) $row->competition : 0;
                $by_practice[ $competition ? 'competition' : 'leisure' ]++;
            }
"""
          if old not in text: raise SystemExit('stats demographic pattern missing')
          p.write_text(text.replace(old,new,1))

          # 2) Add non-destructive traceability columns and make status helper stamp validation.
          p = Path('includes/core/class-ufsc-db-migrations.php')
          text = p.read_text()
          text = text.replace("const MIGRATION_VERSION = '1.5.0';", "const MIGRATION_VERSION = '1.6.0';", 1)
          old = """            'honorability_confirmed_by' => 'bigint(20) unsigned NOT NULL DEFAULT 0',
        );"""
          new = """            'honorability_confirmed_by' => 'bigint(20) unsigned NOT NULL DEFAULT 0',
            'submitted_at'              => 'datetime NULL DEFAULT NULL',
            'validated_at'              => 'datetime NULL DEFAULT NULL',
            'validated_by'              => 'bigint(20) unsigned NULL DEFAULT NULL',
        );"""
          if old not in text: raise SystemExit('migration columns pattern missing')
          p.write_text(text.replace(old,new,1))

          p = Path('inc/common/licence-status.php')
          text = p.read_text()
          old = """\t\tif ( in_array( 'status', $columns, true ) ) {
\t\t\t$data['status'] = $status;
\t\t\t$format[]       = '%s';
\t\t}

\t\tif ( empty( $data ) ) {"""
          new = """\t\tif ( in_array( 'status', $columns, true ) ) {
\t\t\t$data['status'] = $status;
\t\t\t$format[]       = '%s';
\t\t}

        $normalized = self::normalize( $status );
        if ( 'valide' === $normalized ) {
            if ( in_array( 'validated_at', $columns, true ) ) {
                $data['validated_at'] = current_time( 'mysql' );
                $format[] = '%s';
            }
            if ( in_array( 'validated_by', $columns, true ) ) {
                $data['validated_by'] = get_current_user_id();
                $format[] = '%d';
            }
        }

\t\tif ( empty( $data ) ) {"""
          if old not in text: raise SystemExit('status helper pattern missing')
          p.write_text(text.replace(old,new,1))

          # 3) Admin licence save: immutable creation, explicit submitted/validated audit when columns exist.
          p = Path('includes/admin/class-sql-admin.php')
          text = p.read_text()
          marker = """        $data = self::add_detected_category_fields_for_admin_save( $t, $pk, $data, $id );

        // Upload certificat"""
          replacement = """        $data = self::add_detected_category_fields_for_admin_save( $t, $pk, $data, $id );

        // Traceability is additive: never rewrite historical creation dates.
        // Validation stamps are written only for a new transition to validated.
        $licence_columns = self::get_table_columns( $t );
        $previous_status = '';
        if ( $id && in_array( 'statut', $licence_columns, true ) ) {
            $previous_status = (string) $wpdb->get_var( $wpdb->prepare( \"SELECT statut FROM `{$t}` WHERE `{$pk}` = %d\", $id ) );
            $previous_status = function_exists( 'ufsc_normalize_license_status' ) ? ufsc_normalize_license_status( $previous_status ) : sanitize_key( $previous_status );
        }
        $next_status = isset( $data['statut'] ) && function_exists( 'ufsc_normalize_license_status' ) ? ufsc_normalize_license_status( $data['statut'] ) : sanitize_key( (string) ( $data['statut'] ?? '' ) );
        if ( in_array( 'submitted_at', $licence_columns, true ) && in_array( $next_status, array( 'en_attente', 'valide' ), true ) ) {
            $existing_submitted = $id ? (string) $wpdb->get_var( $wpdb->prepare( \"SELECT submitted_at FROM `{$t}` WHERE `{$pk}` = %d\", $id ) ) : '';
            if ( '' === trim( $existing_submitted ) || '0000-00-00 00:00:00' === $existing_submitted ) {
                $data['submitted_at'] = current_time( 'mysql' );
            }
        }
        if ( 'valide' === $next_status && 'valide' !== $previous_status ) {
            if ( in_array( 'validated_at', $licence_columns, true ) ) { $data['validated_at'] = current_time( 'mysql' ); }
            if ( in_array( 'validated_by', $licence_columns, true ) ) { $data['validated_by'] = get_current_user_id(); }
        }

        // Upload certificat"""
          if marker not in text: raise SystemExit('admin traceability marker missing')
          p.write_text(text.replace(marker,replacement,1))

          # 4) Front save stamps submission once when dossier leaves draft.
          p = Path('includes/core/class-unified-handlers.php')
          text = p.read_text()
          old = """        $data = self::add_detected_category_fields( $data, $column_exists );
        $current_season ="""
          new = """        $data = self::add_detected_category_fields( $data, $column_exists );
        if ( $column_exists( 'submitted_at' ) ) {
            $requested_action = sanitize_key( (string) ( $_POST['ufsc_submit_action'] ?? '' ) );
            if ( in_array( $requested_action, array( 'add_to_cart', 'submit', 'finalize' ), true ) ) {
                if ( $licence_id <= 0 ) {
                    $data['submitted_at'] = current_time( 'mysql' );
                } else {
                    $existing_submitted = (string) $wpdb->get_var( $wpdb->prepare( \"SELECT submitted_at FROM `{$licences_table}` WHERE id = %d\", $licence_id ) );
                    if ( '' === trim( $existing_submitted ) || '0000-00-00 00:00:00' === $existing_submitted ) {
                        $data['submitted_at'] = current_time( 'mysql' );
                    }
                }
            }
        }
        $current_season ="""
          if old not in text: raise SystemExit('front traceability marker missing')
          p.write_text(text.replace(old,new,1))

          # 5) Dashboard: action list with exact missing roles/documents + correct validated denominator.
          p = Path('includes/frontend/class-frontend-shortcodes.php')
          text = p.read_text()
          old = """        $mandatory_docs  = array( 'doc_statuts', 'doc_recepisse', 'doc_jo', 'doc_pv_ag', 'doc_cer', 'doc_attestation_cer' );
        $missing_docs    = 0;"""
          new = """        $mandatory_docs  = array( 'doc_statuts', 'doc_recepisse', 'doc_jo', 'doc_pv_ag', 'doc_cer', 'doc_attestation_cer' );
        $mandatory_doc_labels = array(
            'doc_statuts' => __( 'Statuts de l’association', 'ufsc-clubs' ),
            'doc_recepisse' => __( 'Récépissé de déclaration', 'ufsc-clubs' ),
            'doc_jo' => __( 'Publication au Journal Officiel', 'ufsc-clubs' ),
            'doc_pv_ag' => __( 'Procès-verbal d’assemblée générale', 'ufsc-clubs' ),
            'doc_cer' => __( 'Contrat d’engagement républicain', 'ufsc-clubs' ),
            'doc_attestation_cer' => __( 'Attestation CER', 'ufsc-clubs' ),
        );
        $missing_doc_labels = array();
        $missing_docs    = 0;"""
          if old not in text: raise SystemExit('dashboard docs marker missing')
          text = text.replace(old,new,1)
          old = """            if ( empty( $club->$doc_key ) || ! wp_get_attachment_url( $club->$doc_key ) ) {
                $missing_docs++;
            }
        }
"""
          new = """            if ( empty( $club->$doc_key ) || ! wp_get_attachment_url( $club->$doc_key ) ) {
                $missing_docs++;
                $missing_doc_labels[] = $mandatory_doc_labels[ $doc_key ] ?? $doc_key;
            }
        }
        $dashboard_actions = array();
        foreach ( (array) ( $bureau_data['missing_labels'] ?? array() ) as $missing_role_label ) {
            $dashboard_actions[] = array( 'label' => $missing_role_label, 'url' => self::get_club_portal_url( 'club-officers' ) );
        }
        foreach ( $missing_doc_labels as $missing_doc_label ) {
            $dashboard_actions[] = array( 'label' => $missing_doc_label, 'url' => self::get_club_portal_url( 'club-documents' ) );
        }
"""
          if old not in text: raise SystemExit('dashboard missing docs loop missing')
          text = text.replace(old,new,1)
          old = """                        <div class=\"ufsc-dashboard-actions ufsc-dashboard-actions--primary\">"""
          new = """                        <?php if ( $dashboard_actions ) : ?>
                            <section class=\"ufsc-dashboard-todo ufsc-card\" aria-labelledby=\"ufsc-dashboard-todo-title\">
                                <div><h3 id=\"ufsc-dashboard-todo-title\"><?php esc_html_e( 'À compléter sur votre profil', 'ufsc-clubs' ); ?></h3><p><?php esc_html_e( 'Voici les éléments à corriger ou à transmettre. Ouvrez directement la rubrique concernée.', 'ufsc-clubs' ); ?></p></div>
                                <ul><?php foreach ( $dashboard_actions as $dashboard_action ) : ?><li><span><?php echo esc_html( $dashboard_action['label'] ); ?></span><a class=\"ufsc-btn ufsc-btn-secondary\" href=\"<?php echo esc_url( $dashboard_action['url'] ); ?>\"><?php esc_html_e( 'Compléter', 'ufsc-clubs' ); ?></a></li><?php endforeach; ?></ul>
                            </section>
                        <?php else : ?>
                            <div class=\"ufsc-message ufsc-success ufsc-dashboard-complete\"><strong><?php esc_html_e( 'Profil club complet', 'ufsc-clubs' ); ?></strong><span><?php esc_html_e( 'Aucune action requise actuellement.', 'ufsc-clubs' ); ?></span></div>
                        <?php endif; ?>
                        <div class=\"ufsc-dashboard-actions ufsc-dashboard-actions--primary\">"""
          if old not in text: raise SystemExit('dashboard action insertion marker missing')
          text = text.replace(old,new,1)
          text = text.replace("$profile_total = max( 0, (int) ( $stats['total_licences'] ?? 0 ) );", "$profile_total = max( 0, (int) ( $stats['validated_licences'] ?? 0 ) );", 1)
          text = text.replace("'%1$s : %2$d licencié(s), soit %3$d %% du total.'", "'%1$s : %2$d licence(s) validée(s), soit %3$d %% des licences validées de la saison.'", 1)
          text = text.replace("'%d %% des licenciés'", "'%d %% des licences validées'", 1)
          p.write_text(text)

          # 6) Responsive hardening for the account/profile screens from mobile screenshots.
          p = Path('assets/css/ufsc-front.css')
          text = p.read_text()
          text += r'''

/* Club account mobile contract — no desktop-width children may escape the viewport. */
.ufsc-club-portal :is(.ufsc-club-profile-shell,.ufsc-club-profile-layout,.ufsc-club-profile-main,.ufsc-section-header,.ufsc-club-hero,.ufsc-club-hero-content,.ufsc-card,.ufsc-field,.ufsc-board-role-card,.ufsc-profile-insight-band) {
 min-inline-size: 0;
 max-inline-size: 100%;
}
.ufsc-club-portal :is(input,select,textarea,.ufsc-permission-notice,.ufsc-club-account__identity dd,a) { max-inline-size: 100%; }
.ufsc-club-portal .ufsc-club-account__identity :is(dd,a),
.ufsc-club-portal .ufsc-field :is(input,select,textarea) { overflow-wrap: anywhere; word-break: normal; }
.ufsc-club-portal .ufsc-dashboard-todo { display: grid; gap: 14px; margin-block: 16px; }
.ufsc-club-portal .ufsc-dashboard-todo h3 { margin: 0 0 4px; }
.ufsc-club-portal .ufsc-dashboard-todo p { margin: 0; }
.ufsc-club-portal .ufsc-dashboard-todo ul { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.ufsc-club-portal .ufsc-dashboard-todo li { align-items: center; border-top: 1px solid #dbe3ed; display: grid; gap: 8px; grid-template-columns: minmax(0,1fr) auto; padding-top: 8px; }
.ufsc-club-portal .ufsc-dashboard-complete { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 767px) {
 body.ufsc-club-portal-page :is(.site-content,.ast-container,.entry-content,.elementor-widget-container) { max-inline-size: 100%; min-inline-size: 0; }
 :is(.ufsc-club-portal,.ufsc-licences-section,.ufsc-licence-detail,.ufsc-add-licence-section) { inline-size: calc(100% - 20px); margin-inline: auto; max-inline-size: 100%; }
 .ufsc-club-portal .ufsc-club-profile-shell { inline-size: 100%; overflow-x: clip; }
 .ufsc-club-portal .ufsc-section-header.ufsc-profile-header { gap: 14px; padding: 22px 18px; }
 .ufsc-club-portal .ufsc-section-header.ufsc-profile-header :is(h3,p) { max-inline-size: 100%; overflow-wrap: anywhere; }
 .ufsc-club-portal .ufsc-permission-notice { inline-size: 100%; margin: 0; }
 .ufsc-club-portal .ufsc-club-hero { grid-template-columns: minmax(0,1fr); padding: 14px; }
 .ufsc-club-portal .ufsc-logo-editor { grid-template-columns: minmax(0,1fr); justify-items: stretch; }
 .ufsc-club-portal .ufsc-logo-editor__preview { grid-row: auto; justify-self: center; }
 .ufsc-club-portal .ufsc-logo-editor__remove { grid-column: auto; }
 .ufsc-club-portal .ufsc-logo-editor__upload :is(.ufsc-btn,.ufsc-logo-editor__file) { inline-size: 100%; min-inline-size: 0; }
 .ufsc-club-portal .ufsc-profile-insight-band { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
 .ufsc-club-portal .ufsc-profile-insight { padding: 14px; }
 .ufsc-club-portal .ufsc-profile-cards > .ufsc-card { padding: 18px 14px; }
 .ufsc-club-portal .ufsc-field :is(input,select,textarea) { inline-size: 100%; max-inline-size: 100%; }
 .ufsc-club-portal .ufsc-dashboard-todo li { grid-template-columns: minmax(0,1fr); }
 .ufsc-club-portal .ufsc-dashboard-todo .ufsc-btn { inline-size: 100%; min-inline-size: 0; }
}
@media (max-width: 420px) {
 .ufsc-club-portal .ufsc-profile-insight-band { grid-template-columns: minmax(0,1fr); }
 .ufsc-club-portal .ufsc-club-account__nav.ufsc-club-portal__nav { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
'''
          p.write_text(text)

          # 7) Static regression contract for this PR.
          Path('tests/test-club-dashboard-traceability-static.php').write_text(r'''<?php
          $root = dirname(__DIR__);
          $stats = file_get_contents($root . '/includes/front/class-ufsc-stats.php');
          $front = file_get_contents($root . '/includes/frontend/class-frontend-shortcodes.php');
          $migration = file_get_contents($root . '/includes/core/class-ufsc-db-migrations.php');
          $admin = file_get_contents($root . '/includes/admin/class-sql-admin.php');
          $css = file_get_contents($root . '/assets/css/ufsc-front.css');
          $fail = function($m){ fwrite(STDERR, $m . PHP_EOL); exit(1); };
          strpos($stats, '$is_validated') !== false || $fail('validated-only demographics guard missing');
          strpos($front, "validated_licences'] ?? 0") !== false || $fail('validated demographic denominator missing');
          strpos($front, 'ufsc-dashboard-todo') !== false || $fail('actionable dashboard list missing');
          strpos($front, 'Statuts de l’association') !== false || $fail('missing document labels absent');
          strpos($migration, "'validated_at'") !== false || $fail('licence validation timestamp column missing');
          strpos($migration, "'validated_by'") !== false || $fail('licence validator column missing');
          strpos($admin, 'Traceability is additive') !== false || $fail('admin traceability guard missing');
          strpos($css, 'Club account mobile contract') !== false || $fail('mobile account contract missing');
          echo "club dashboard traceability static checks passed\n";
          ''')
      - name: PHP syntax
        run: |
          php -l includes/front/class-ufsc-stats.php
          php -l includes/frontend/class-frontend-shortcodes.php
          php -l includes/core/class-ufsc-db-migrations.php
          php -l inc/common/licence-status.php
          php -l includes/admin/class-sql-admin.php
          php -l includes/core/class-unified-handlers.php
          php tests/test-club-dashboard-traceability-static.php
      - name: Commit
        run: |
          rm .github/workflows/agent-apply-club-dashboard-fix.yml
          git config user.name DavyReactiv
          git config user.email 41898282+DavyReactiv@users.noreply.github.com
          git add assets/css/ufsc-front.css includes/front/class-ufsc-stats.php includes/frontend/class-frontend-shortcodes.php includes/core/class-ufsc-db-migrations.php inc/common/licence-status.php includes/admin/class-sql-admin.php includes/core/class-unified-handlers.php tests/test-club-dashboard-traceability-static.php .github/workflows/agent-apply-club-dashboard-fix.yml
          git commit -m "fix: fiabiliser compte club saison traçabilité mobile"
          git push origin HEAD:agent/club-dashboard-traceability-responsive
